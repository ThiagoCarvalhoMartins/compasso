# Deploy contínuo na Azure (Fase 0 do roadmap).
# Segredos necessários no repositório (Settings → Secrets and variables → Actions):
#   AZURE_STATIC_WEB_APPS_TOKEN_WEB    token de deploy do Static Web App do usuário
#   AZURE_STATIC_WEB_APPS_TOKEN_ADMIN  token de deploy do Static Web App do admin
#   AZURE_WEBAPP_PUBLISH_PROFILE       publish profile do App Service da API
# Variáveis (vars):
#   API_URL           ex.: https://api.agendaemritmo.com.br/api/v1
#   GOOGLE_CLIENT_ID  client id OAuth do Google
#   AZURE_WEBAPP_NAME nome do App Service da API
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @compasso/web build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_WEB }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @compasso/admin build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_ADMIN }}
          action: upload
          app_location: apps/admin/dist
          skip_app_build: true

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @compasso/api build
      # Pacote autocontido para o App Service: bundle + dependências de produção + schema/migrations do Prisma.
      # node_modules sem symlinks: os links do layout padrão do pnpm podem não sobreviver ao zip deploy.
      - run: pnpm --filter @compasso/api deploy --prod --config.node-linker=hoisted ./deploy-api
      - run: cp -r apps/api/dist deploy-api/ && cd deploy-api && npx prisma generate
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-api
      # As migrations rodam na inicialização do App Service (startup command: `node node_modules/prisma/build/index.js migrate deploy && node dist/index.js`).
